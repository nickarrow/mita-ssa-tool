# Continuous Integration
# Runs on pull requests and pushes to main
# Validates code quality without deploying

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        # 22.18 is the floor, not a preference: the XLSX workbook generator is a
        # TypeScript file run directly by Node, which needs Node's native type
        # stripping (unflagged from 22.18). On Node 20 it fails with an
        # unknown-file-extension error. Kept in step with `.nvmrc` and the `engines`
        # field in package.json.
        uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linting
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build (verify it compiles)
        env:
          VITE_BASE_PATH: /test-build/
        run: npm run build
